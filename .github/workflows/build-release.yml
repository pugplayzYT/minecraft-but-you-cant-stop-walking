name: Build and Release JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Forge mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-but-you-cant-stop-walking
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Replace rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Automatic Forge 1.21.1 build from commit $GITHUB_SHA."
