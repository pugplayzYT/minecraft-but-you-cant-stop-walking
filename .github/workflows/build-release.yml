name: Build All Loaders

on:
  push:
    branches: [ main, forge, fabric, neoforge ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: multi-loader-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ forge, fabric, neoforge ]

    steps:
      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build ${{ matrix.branch }} mod
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload ${{ matrix.branch }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.branch }}
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all loader JARs
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
          merge-multiple: true

      - name: Replace rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Latest multi-loader build" \
            --notes "Automatic Minecraft 1.21.1 build containing Forge, Fabric, and NeoForge JARs."
